<!doctype html>
<html lang="pt-BR">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Resultados Oficiais F1</title><link rel="stylesheet" href="/styles.css" /></head>
  <body><main class="shell"><section class="dashboard-header"><div><p class="eyebrow">Formula1.com • sem API-Sports</p><h1>Resultados Oficiais F1</h1><p>Busque direto no site oficial e gere o Short da sessão publicada.</p></div><a class="back-link" href="/">← Home</a></section>
    <section class="dashboard-grid official-results-grid"><article class="panel"><div class="panel-header"><div><span class="eyebrow">Fonte oficial</span><h2>Selecione a sessão</h2></div><span id="source-chip" class="source-chip">Formula1.com</span></div>
      <div class="form-grid"><label>Temporada<input id="season-input" type="number" min="1950" max="2100" /></label><label>GP<select id="race-select"><option>Carregando…</option></select></label><label>Sessão<select id="session-select"><option value="race">Resultado da corrida</option><option value="sprint">Resultado da sprint</option><option value="starting-grid">Classificação de largada</option></select></label><label>Texto auxiliar<input id="label-input" placeholder="Ex.: GP da Itália" /></label><label>Nome do MP4<input id="output-input" placeholder="monza-corrida-2026.mp4" /></label><label>Trilha<select id="soundtrack-select"></select></label><label>Volume<input id="volume-input" type="number" min="0" max="1" step="0.05" value="0.3" /></label></div>
      <div class="button-row"><button id="prepare-button" class="button button-primary">Preparar Short</button><button id="render-button" class="button button-secondary">Renderizar MP4</button></div><p id="status-message" class="status-message"></p><p id="output-message" class="output-message"></p><div id="download-box"></div></article>
      <article class="panel preview-panel"><div class="panel-header"><div><span class="eyebrow">Preview</span><h2>Composição vertical</h2></div></div><div class="preview-frame-wrap"><iframe id="preview-frame" title="Preview do Short"></iframe></div><div class="preview-controls"><input id="studio-url" placeholder="http://127.0.0.1:3000" /><button id="apply-preview-button" class="button button-secondary">Atualizar</button><a id="open-preview-link" class="button button-ghost" target="_blank" rel="noreferrer">Abrir Studio</a></div></article></section>
  </main><script src="/f1-official-results/app.js"></script></body>
</html>
